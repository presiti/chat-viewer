[package]
name = "chat-viewer"
version = "0.2.2"
description = "Lightweight Synology Chat desktop client"
authors = ["duo"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "chat_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
mime_guess = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
rand = "0.8"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
